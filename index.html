<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal EXIM</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    .container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      /* Menambah tinggi iframe 50px */
      height: calc(100% + 50px);
      /* Mendorong bagian atas iframe (banner Google) ke luar layar */
      margin-top: -50px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <iframe src="https://script.google.com/macros/s/AKfycbyxg0mddRYbApsUfQexlA9zC7LQWhLr3kh5FJeXKhAVYCpSoJnrrrpAbfPeA2ts-4vP/exec"></iframe>
  </div>
</body>
</html>
